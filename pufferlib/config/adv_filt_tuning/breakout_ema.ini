[base]
package = ocean
env_name = puffer_breakout_ema
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
num_envs = 1024
frameskip = 4

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
total_timesteps = 75_000_000
adam_beta1 = 0.8946507418260217
adam_beta2 = 0.9
adam_eps = 0.0001
batch_size = auto
bptt_horizon = 64
clip_coef = 0.19696765958267629
ent_coef = 0.0005690816545012474
gae_lambda = 0.747650023961198
gamma = 0.9997053654668936
learning_rate = 0.044482546441415506
max_grad_norm = 2.2356112188495723
minibatch_size = 32768
prio_alpha = 0.98967001208896
prio_beta0 = 0.09999999999999998
vf_clip_coef = 2.178492167689251
vf_coef = 1.6832989594296321
vtrace_c_clip = 2.878171091654008
vtrace_rho_clip = 0.7876748061547312
adv_filter_type = ema
filter_by_abs = True
adv_agg = sum
ema_beta = 0.25
ema_eta = 0.01

[sweep.train.ema_beta]
distribution = logit_normal
min = 0.1
mean = 0.85
max = 0.99
scale = auto

[sweep.train.ema_eta]
distribution = log_normal
min = 0.00001
mean = 0.01
max = 0.1
scale = 0.5
